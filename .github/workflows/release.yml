name: Release Xiphos Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm install

      - name: Build Next.js Static Export
        working-directory: ./web
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bundle Python Backend
        run: |
          # Run the custom python embedding script
          .\scripts\bundle_python.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Xiphos ${{ github.ref_name }}"
          releaseBody: "Automated release of Xiphos desktop application."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
