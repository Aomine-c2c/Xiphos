[package]
name = "future-rust-ui"
version = "0.1.0"
edition = "2021"
description = "Future Rust-based UI for Xiphos"

[dependencies]
dioxus = { version = "0.5.0", features = ["desktop"] }
dioxus-logger = "0.5.1"
log = "0.4.20"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
redis = { version = "1.3.0", features = ["aio", "connection-manager", "tokio-comp"] }
